### DOCS STAGE JOBS ###

docs:
  stage: docs
  extends:
    - .nox
    - .rules_main_mr_docs
  image: ubuntu:24.04
  needs: []
  tags:
    - $DOCS_RUNNER_TAG
  before_script:
    - apt-get update -qq && apt-get install -qq -y curl git graphviz libgl1 > /dev/null
    - git fetch --tags --force --quiet  # Ensure version tags are available for setuptools-scm
    - curl -LsSf https://astral.sh/uv/install.sh | sh
    - uv tool install nox --with nox-uv
  script:
    # Jupyter's hashes cover each notebook's code cells. docs/notebook_cache_inputs.py covers the
    # rest: it validates the shared inputs and the source files each notebook imports against the
    # actual restored cache and removes the cached outputs of only the stale notebooks. Checking the
    # cache, not the previous commit, means a skipped or canceled pipeline cannot leave stale outputs.
    # Merge request pipelines are best effort instead: they start from the restored cache and
    # re-execute only the notebooks whose code cells changed, so main's builds are the only ones that
    # pay for a widely imported file, and a notebook that a library change breaks first fails on the target branch.
    # Merge train cars do not build the docs (see .rules_not_on_train in base.yml).
    - |
      BEST_EFFORT=
      if [ "$CI_PIPELINE_SOURCE" = merge_request_event ]; then
        BEST_EFFORT=1
        echo "Docs cache: best effort on a merge request pipeline; skipping the execution-input check."
      fi
      if [ -z "$DOCS_CLEAN" ]; then
        bash docs/fetch-docs-cache.sh || true
        if [ -z "$BEST_EFFORT" ] && ! uv run --no-project python docs/notebook_cache_inputs.py check; then
          DOCS_CLEAN='-- clean'
        fi
      fi
      # nox must use the cache we just checked, without fetching it again.
      export DOCS_CACHE_RESTORED=1
    # Harbor cache of the notebook datasets, kept outside the docs build: the build
    # downloads whatever is missing, so a miss or a Harbor failure only costs time.
    # Restore before the build, and only when a notebook is about to execute (the check
    # above has removed its cached output, so check_notebook_cache.py exits non-zero);
    # store after it, if the restore missed.
    - |
      if [ -n "$DOCS_CLEAN" ] || ! uv run --no-project --with jupytext --with nbformat python docs/check_notebook_cache.py >/dev/null 2>&1; then
        bash docs/harbor-datasets-cache.sh pull
      fi
    - uvx nox -P "$DOCS_PYTHON_VERSION" -e docs $DOCS_CLEAN
    # Stamp only after a successful build; the manifest travels with the cache
    # to docs-artifacts/<ref>, including when a later build falls back to main.
    # A best-effort build leaves the manifest alone: it keeps describing the tree the cached
    # outputs were last validated against.
    - |
      if [ -z "$BEST_EFFORT" ]; then
        uv run --no-project python docs/notebook_cache_inputs.py record
      fi
    - bash docs/harbor-datasets-cache.sh push
    - bash docs/push-docs-cache.sh
  after_script:
    # The Kubernetes cache helper can run as a different uid. Hugging Face tree
    # metadata is created as 0600, so make the dataset cache readable first.
    - |
      if [ -d docs/source/notebooks/data ]; then
        chmod -R a+rX docs/source/notebooks/data
      fi
    - !reference [.nox, after_script]
  cache:
    # uv cache, shared with the other .nox jobs (same key derived from uv.lock).
    - key:
        files:
          - uv.lock
      paths:
        - $UV_CACHE_DIR
    # Notebook datasets downloaded during the docs build. Notebooks (and
    # docs/source/data.py) execute with their working dir set to
    # docs/source/notebooks, so datasets land in docs/source/notebooks/data.
    # Dedicated key so other jobs don't clobber it; keyed on data.py so adding
    # or changing a dataset invalidates the cache.
    - key:
        files:
          - docs/source/data.py
        prefix: docs-datasets
      paths:
        - docs/source/notebooks/data
    # Intersphinx inventories pre-fetched by docs/fetch-intersphinx-inventories.py
    # (the build reads them from disk and never fetches over the network). Keyed
    # on conf.py so mapping changes trigger a re-fetch; the script also re-fetches
    # anything older than its TTL, and falls back to a stale copy if a fetch fails.
    - key:
        files:
          - docs/source/conf.py
        prefix: intersphinx-inventories
      paths:
        - docs/source/_intersphinx
  artifacts:
    paths:
      - output/docs/html/
    when: always
  variables:
    UV_INSTALL_DIR: /usr/local/bin
    UV_COMPILE_BYTECODE: 1
    UV_NO_PROGRESS: true
    # Unbuffered so the dataset download shows up in the job log as it happens
    # (buffered, it printed in one burst after a 1+ hour silence).
    PYTHONUNBUFFERED: '1'
    DOCS_PYTHON_VERSION: '3.13'
    DATAEVAL_NOX_UV_EXTRAS_OVERRIDE: cu130
    GIT_STRATEGY: clone  # Full clone needed for artifact branch operations

doctest:
  tags:
    - k8s-medium-cpu
  stage: docs
  extends:
    - .nox
    - .rules_main_mr_docs
  script:
    - uvx nox -e doctest

linkchecker:
  stage: docs
  extends: .rules_main_mr_docs
  needs: []
  image:
    name: ghcr.io/tcort/markdown-link-check:stable
    entrypoint: ['/bin/sh', '-c']
  script:
    - markdown-link-check --config docs/.markdown-link-check.json *.md
    - markdown-link-check --config docs/.markdown-link-check.json ./docs/source
  # Allow failures in link checking to avoid blocking merges due to transient issues
  # and anti-scraping measures on some sites. Warnings should be reviewed and addressed.
  allow_failure: true

markdownlint:
  stage: docs
  extends: .rules_main_mr_docs
  needs: []
  image:
    name: davidanson/markdownlint-cli2
    entrypoint: ['']
  script: |
    markdownlint-cli2 '*.md' 'docs/**/*.md' '#node_modules'
