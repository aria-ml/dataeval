###############################################################################
# Stage -- A child pipeline to run the DevSecOps components
###############################################################################

stages:
  - sr-compliance
  - unit-test
  - tr-compliance
  - ir-compliance
  - dsor-compliance
  - advana-compliance
  - validate
  - summary

# uv support lives on the components' `uv-support` branch and is not tagged yet.
# `components_branch` must match the ref each component is pulled from: these
# jobs clone the components repo at run time to fetch their helper scripts, and
# the 1.2.0 tag predates both the uv-aware scripts and the rename of
# validate-poetry-and-conda. Move all five refs to the tag once it is cut.
include:
  - component: gitlab.jatic.net/jatic/devsecops/components/sr-compliance@uv-support
    inputs:
      package_name: "${PACKAGE_NAME}"
      tools_used: [pyproject, uv, ruff]
      package_manager: uv
      # validate-private-modules only has to import dataeval; the default groups
      # would drag in docs/type/test tooling. `--extra cpu` keeps torch on the
      # CPU index (see [tool.uv.sources]) instead of the PyPI CUDA wheel.
      install_options: --no-default-groups --extra cpu
      components_branch: uv-support
      generate_environment_yml: false
      conda_env_name: "dataeval"
      conda_package_aliases: "xxhash=python-xxhash"
      pyproject_format: pep621
      full_execution_on_commit: true
      allow_failure: true

  - component: gitlab.jatic.net/jatic/devsecops/components/ir-compliance@1.2.0
    inputs:
      stage: ir-compliance
      maite_interop_scope: provider
      full_execution_on_commit: true
      allow_failure: true

  - component: gitlab.jatic.net/jatic/devsecops/components/unit-test@uv-support
    inputs:
      stage: unit-test
      full_execution_on_commit: true
      package_name: "${PACKAGE_NAME}"
      marker: required
      dependency: required
      executor: uv
      install_options: --no-default-groups --group test --extra cpu
      components_branch: uv-support
      allow_failure: true

  - component: gitlab.jatic.net/jatic/devsecops/components/unit-test@uv-support
    inputs:
      stage: unit-test
      full_execution_on_commit: true
      package_name: "${PACKAGE_NAME}"
      marker: optional
      dependency: optional
      executor: uv
      install_options: --no-default-groups --group test-onnx --extra cpu --extra onnx --extra opencv --extra ontology
      components_branch: uv-support
      allow_failure: true

  - component: gitlab.jatic.net/jatic/devsecops/components/unit-test@uv-support
    inputs:
      stage: unit-test
      full_execution_on_commit: true
      package_name: "${PACKAGE_NAME}"
      marker: optional
      dependency: required
      executor: uv
      install_options: --no-default-groups --group test --extra cpu
      components_branch: uv-support
      allow_failure: true

  - component: gitlab.jatic.net/jatic/devsecops/components/unit-test@uv-support
    inputs:
      stage: unit-test
      full_execution_on_commit: true
      package_name: "${PACKAGE_NAME}"
      marker: all
      dependency: required
      executor: uv
      install_options: --no-default-groups --group test --extra cpu
      components_branch: uv-support
      allow_failure: true

  - component: gitlab.jatic.net/jatic/devsecops/components/tr-compliance@uv-support
    inputs:
      package_name: "${PACKAGE_NAME}"
      package_manager: uv
      # Mirrors the `type` nox session so pyright sees the same environment.
      install_options: --no-default-groups --group type --extra cpu --extra onnx --extra opencv --extra ontology
      components_branch: uv-support
      full_execution_on_commit: true
      allow_failure: true

  - component: gitlab.jatic.net/jatic/devsecops/components/dsor-compliance@1.2.0
    inputs:
      full_execution_on_commit: true
      sast_excluded_paths: tests,docs,verification,README.md
      sast_search_max_depth: "2"
      allow_failure: true

  - component: gitlab.jatic.net/jatic/devsecops/components/advana-compliance@1.2.0
    inputs:
      full_execution_on_commit: true
      allow_failure: true

  - component: gitlab.jatic.net/jatic/devsecops/components/validate-pipeline@1.2.0
    inputs:
      full_execution_on_commit: true

  - component: gitlab.jatic.net/jatic/devsecops/components/pipeline-report@1.2.0
    inputs:
      full_execution_on_commit: true
      components_branch: 1.2.0
