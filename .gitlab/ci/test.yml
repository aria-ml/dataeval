### TEST STAGE JOBS ###

lint:
  extends:
    - .nox
    - .rules_main_mr
  script:
    - uvx nox -e lint

minimum install:
  extends:
    - .nox
    - .rules_main_mr_code
  variables:
    PYTHON_VERSION: '3.10'
  script:
    - uvx nox -e deps

typecheck:
  extends:
    - .nox_all
    - .rules_main_mr_code
  script:
    - uvx nox -e type

test:
  extends:
    - .nox_all
    - .rules_main_mr
  before_script:
    # The comprehensive lane runs the ffmpeg-marked tests, which build their synthetic
    # clips with ffmpeg/ffprobe (see tests/fixtures/videos.py).
    - apt-get update && apt-get install -y --no-install-recommends ffmpeg
    - uv tool install nox --with nox-uv
  script:
    - uvx nox -e test
  cache:
    # `extends` replaces list values, so the uv cache from .nox is repeated here.
    - key:
        files:
          - uv.lock
      paths:
        - $UV_CACHE_DIR
    # Numba compiles the ported HDBSCAN kernels in ~19s; persisting the cache
    # turns that into a ~0.5s load. Keyed per interpreter so the matrix legs do
    # not overwrite each other.
    - key: numba-$PYTHON_VERSION
      paths:
        - $NUMBA_CACHE_DIR
  artifacts:
    reports:
      junit: output/junit.*.xml
    paths:
      - output/*

conda:
  extends:
    - .conda_all
    - .rules_main_mr_code
  script:
    # No opencv or ffmpeg in this environment; see the `deps` session in noxfile.py.
    - pytest -m 'not (optional or ffmpeg)'

verify:
  extends:
    - .nox_all
    - .rules_main_mr
  variables:
    SETUPTOOLS_SCM_PRETEND_VERSION: '0.0.0'
  script:
    - uvx nox -e verify
  artifacts:
    reports:
      junit: output/verify.*.xml
    paths:
      - output/verification_report.json

verify lock:
  extends:
    - .nox
    - .rules_main_mr_deps
  script:
    - uvx nox -e check