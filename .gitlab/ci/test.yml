### TEST STAGE JOBS ###

lint:
  extends: 
    - .nox
    - .rules_main_mr
  script:
    - nox -e lint

minimum install:
  tags:
    - k8s-medium-cpu
  extends: 
    - .nox_all
    - .rules_main_mr_code
  script:
    - nox -e deps

typecheck:
  tags:
    - k8s-medium-cpu
  extends: 
    - .nox_all
    - .rules_main_mr_code
  script:
    - nox -e type

test:
  tags:
    - k8s-medium-cpu
  extends: 
    - .nox_all
    - .rules_main_mr_code
  script:
    - nox -e test
  artifacts:
    reports:
      junit: output/junit.*.xml
    paths:
      - output/*

conda:
  tags:
    - k8s-medium-cpu
  extends: 
    - .conda_all
    - .rules_main_mr_code
  script:
    - pytest -m 'not optional'

verify lock:
  extends: 
    - .nox
    - .rules_main_mr_deps
  script:
    - nox -e check