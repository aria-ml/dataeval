### RELEASE STAGE JOBS ###

coverage:
  stage: release
  extends: .rules_main_mr
  needs: [test]
  before_script:
    - uv pip install coverage --system
  script:
    - cp --recursive $(pwd) /dataeval
    - coverage combine ./output
    - coverage report -m --skip-empty --precision=2
    - coverage xml --skip-empty
    - coverage html --skip-empty
  coverage: "/(?i)total.*? (100(?:\\.0+)?\\%|[1-9]?\\d(?:\\.\\d+)?\\%)$/"
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    paths:
      - coverage.xml
      - htmlcov/

# Single Pages deployment per merge request, published under a path prefix
# (parallel deployments) rather than through the Pages artifacts proxy, which
# GitLab 19 rejects with a 403. Serves a landing page linking to the docs build
# and the coverage report.
pages preview:
  stage: release
  extends: .rules_mr_preview
  needs:
    - job: docs
      artifacts: true
      optional: true
    - job: coverage
      artifacts: true
      optional: true
  script:
    - .gitlab/scripts/build_preview_site.sh
  pages:
    publish: public
    path_prefix: '$PAGES_PREFIX'
    expire_in: 1 week
  artifacts:
    paths:
      - public/
  environment:
    name: 'preview/$CI_MERGE_REQUEST_IID'
    # Inside a Pages job, CI_PAGES_URL already includes the path prefix.
    # Appending PAGES_PREFIX here would duplicate it.
    url: '$CI_PAGES_URL'
    auto_stop_in: '1 week'
  variables:
    PAGES_PREFIX: 'mr-$CI_MERGE_REQUEST_IID'

pages:
  stage: release
  extends: .rules_main_only
  needs:
    - job: docs
      artifacts: true
  script:
    - mv output/docs/html/ ./public/
  artifacts:
    paths:
      - public

# Coverage report for main, published as its own parallel deployment at
# <pages url>/coverage so it refreshes independently of the root docs site.
# `pages.publish` deploys straight from htmlcov/ so this job never competes
# with the root deployment for public/.
pages coverage:
  stage: release
  extends: .rules_main_only
  needs:
    - job: coverage
      artifacts: true
  script:
    - echo "Publishing coverage report to $CI_PAGES_URL"
  pages:
    publish: htmlcov
    path_prefix: coverage
    expire_in: never
  artifacts:
    paths:
      - htmlcov/

validate release label:
  stage: release
  extends: .rules_mr_only
  needs: []
  script:
    - uv run python .gitlab/scripts/validate_release_label.py

# This job will only run if all previous stages have succeeded,
# and it creates a tag that signifies that all testing has passed.
tag release candidate:
  stage: release
  extends: .rules_main_only
  before_script:
    - uv pip install requests --system
  script:
    - uv run python .gitlab/scripts/update_latest_known_good.py

# This job cleans up orphan docs-artifacts/* branches
# associated with merged branches.
remove docs artifact branches:
  stage: release
  extends: .rules_main_only
  needs: []
  before_script:
    - uv pip install requests --system
  script:
    - uv run python .gitlab/scripts/remove_docs_artifact_branches.py
  allow_failure: true

# This job updates the changelog and tags the commit hash with a
# new version tag, which gets picked up and published from a GitHub
# action defined in .github/workflows/publish.yml
create release:
  stage: release
  extends: .rules_release_only
  needs: []
  # Serialize with 'create pre-release' - both commit and tag main, so concurrent
  # runs compute the same version and the loser fails on tag creation
  resource_group: release
  # The commit and the tag are two separate API calls; an auto-cancel landing
  # between them leaves an untagged release commit on main, so opt out of the
  # workflow-level auto_cancel that the default 'interruptible: true' enables.
  interruptible: false
  before_script:
    - uv pip install requests --system
  script:
    - uv run python .gitlab/scripts/create_release.py

# This job creates a pre-release version tag (e.g., v1.0.0-rc0, v1.0.0-rc1)
# Triggered by setting CREATE_PRE_RELEASE=true in scheduled pipeline
create pre-release:
  stage: release
  extends: .rules_prerelease_only
  needs: []
  resource_group: release
  interruptible: false
  before_script:
    - uv pip install requests --system
  script:
    - uv run python .gitlab/scripts/create_prerelease.py

# This job runs verification tests, generates test case markdown files and
# VCRM, and pushes the artifacts to the DataEval meta repo (project 409).
publish verification:
  stage: release
  extends:
    - .nox
    - .rules_verification_only
  # Wait for the release tag when one is being cut so the artifacts are labelled
  # with it; on a standalone PUBLISH_VERIFICATION run that job is absent and the
  # optional need is ignored.
  needs:
    - job: create release
      optional: true
  variables:
    GIT_DEPTH: 0
  before_script:
    - uv tool install nox --with nox-uv
    - uv pip install requests pyyaml --system
  script:
    - uvx nox -e verify
    - uv run python .gitlab/scripts/push_verification.py
  artifacts:
    paths:
      - output/metarepo/

export-merged-sbom:
  stage: release
  extends: .rules_release_only
  image: docker:stable
  before_script:
    - apk add --update jq curl
  script:
    - >
      curl --header "Authorization: Bearer $PRIVATE_TOKEN"
      --output export.sh --url "https://gitlab.jatic.net/api/v4/snippets/7/raw"
    - /bin/sh export.sh
  artifacts:
    paths:
      - "gl-sbom-merged-*.cdx.json"
  variables:
    PRIVATE_TOKEN: $DATAEVAL_BUILD_PAT

# This job runs automatically on commits to release/v* branches
# and creates patch releases by updating changelog and tagging
create patch release:
  stage: release
  extends: .rules_release_branch_only
  needs: []
  interruptible: false
  before_script:
    - uv pip install requests --system
  script:
    - uv run python .gitlab/scripts/create_patch_release.py
