variables:
  PYTHON_LATEST_SUPPORTED_VERSION: '3.14'
  SAST_EXCLUDED_PATHS: docs,output,tests,verification,.github,.gitlab,.nox,.venv
  DOCS_RUNNER_TAG: single-gpu
  UV_CACHE_DIR: .uv-cache
  UV_LINK_MODE: copy
  UV_IMAGE: ghcr.io/astral-sh/uv
  UV_BASE_LAYER: bookworm
  # Kept in the checkout so the test job can persist it via `cache:`. The test
  # suite warms it; see tests/fixtures/numba_cache.py.
  NUMBA_CACHE_DIR: .numba-cache
  FORCE_COLOR: '1'
  RELEASE_BRANCH_PATTERN: '/^release\/v.*/'
  # Commits to main normally force a full notebook re-execution (DOCS_CLEAN
  # below). Putting +skipdocsclean in the commit message drops that, so the docs
  # build reuses the cached notebook outputs from docs-artifacts/main and only
  # re-executes notebooks whose code actually changed.
  DOCS_SKIP_CLEAN_PATTERN: '/\+skipdocsclean/'

.python_versions: &python_versions
  - PYTHON_VERSION: ['3.10', '3.11', '3.12', '3.13', '3.14']

workflow:
  # Allows jobs in this workflow to be interrupted:
  # https://gitlab.jatic.net/help/ci/yaml/index.md#workflowauto_cancelon_new_commit
  auto_cancel:
    on_new_commit: interruptible
  rules:
    # Variable-triggered automation workflows, runnable from a pipeline schedule,
    # the web 'Run pipeline' form or the API. These have to be matched ahead of the
    # CHANGELOG.md filters below: GitLab evaluates `changes` as true whenever a
    # pipeline has no git push event behind it, so those filters would otherwise
    # reject every one of these triggers before its job rules are ever consulted.
    # Publish Verification Workflow
    - if: $PUBLISH_VERIFICATION
    # Release Workflow
    - if: $CREATE_NEW_RELEASE
    # Pre-release Workflow
    - if: $CREATE_PRE_RELEASE
    # Nightly Docs Cache Update Workflow
    - if: $CI_PIPELINE_SOURCE == 'schedule' && $DOCS_NIGHTLY
    # Merge Request Workflow
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    # API-triggered pipelines on release branches or main (from release scripts for docs builds)
    - if: $CI_PIPELINE_SOURCE == 'api' && ($CI_COMMIT_BRANCH =~ $RELEASE_BRANCH_PATTERN || $CI_COMMIT_BRANCH == 'main')
    # Skip CHANGELOG.md updates
    - if: $CI_COMMIT_BRANCH == 'main'
      changes: ['CHANGELOG.md']
      when: never
    # Skip CHANGELOG.md updates on release branches (prevents cyclic loop from create_patch_release.py)
    - if: $CI_COMMIT_BRANCH =~ $RELEASE_BRANCH_PATTERN
      changes: ['CHANGELOG.md']
      when: never
    # Gitlab web UI trigger
    - if: $CI_PIPELINE_SOURCE == 'web'
    # Commit Main Branch Workflow
    - if: $CI_COMMIT_BRANCH == 'main'
      variables:
        DOCS_RUNNER_TAG: 'multi-gpu'
    # Commit Release Branch Workflow
    - if: $CI_COMMIT_BRANCH =~ $RELEASE_BRANCH_PATTERN

default:
  # This should allow pipelines to auto-cancel when redundant:
  # https://gitlab.jatic.net/help/ci/pipelines/settings.md#auto-cancel-redundant-pipelines
  # https://gitlab.jatic.net/help/ci/yaml/index.md#interruptible
  interruptible: true
  tags:
    - autoscaler

image: $UV_IMAGE:python$PYTHON_LATEST_SUPPORTED_VERSION-$UV_BASE_LAYER

stages:
  - test
  - docs
  - release
  - security
  - compliance


### SHARED JOB TEMPLATES ###

.nox:
  needs: []
  image: $UV_IMAGE:python$PYTHON_VERSION-$UV_BASE_LAYER
  before_script:
    - uv tool install nox --with nox-uv
  cache:
    - key:
        files:
          - uv.lock
      paths:
        - $UV_CACHE_DIR
  after_script:
    - uv cache prune --ci
  variables:
    PYTHON_VERSION: $PYTHON_LATEST_SUPPORTED_VERSION

.nox_all:
  extends: .nox
  parallel:
    matrix: *python_versions

.conda:
  needs: []
  image: mambaorg/micromamba:2-ubuntu24.04
  before_script:
    - eval "$(micromamba shell hook --shell bash)"
    - micromamba create -f environment.yml -n dataeval python=$PYTHON_VERSION
    - micromamba activate dataeval
    - micromamba install pytest pytest-xdist filelock requests
    - pip install -e . --no-deps
    - micromamba list
  variables:
    SETUPTOOLS_SCM_PRETEND_VERSION: '0.0.0'

.conda_all:
  extends: .conda
  parallel:
    matrix: *python_versions

### SHARED RULE TEMPLATES ###

.rules_main_mr:
  rules:
    - if: $CREATE_NEW_RELEASE || $CREATE_PRE_RELEASE || $PUBLISH_VERIFICATION
      when: never
    - if: $CI_COMMIT_BRANCH == 'main'
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'

.rules_main_mr_code:
  rules:
    - if: $CREATE_NEW_RELEASE || $CREATE_PRE_RELEASE || $PUBLISH_VERIFICATION
      when: never
    - if: $CI_COMMIT_BRANCH == 'main'
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
      changes:
        paths:
          - src/**/*
          - tests/**/*
          - uv.lock

.rules_main_mr_deps:
  rules:
    - if: $CREATE_NEW_RELEASE || $CREATE_PRE_RELEASE || $PUBLISH_VERIFICATION
      when: never
    - if: $CI_COMMIT_BRANCH == 'main'
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
      changes:
        paths:
          - pyproject.toml
          - uv.lock

.rules_main_mr_docs:
  rules:
    - if: $CREATE_NEW_RELEASE || $CREATE_PRE_RELEASE || $PUBLISH_VERIFICATION
      when: never
    # Build off the cache instead of re-executing every notebook. Scheduled
    # pipelines (the nightly cache refresh) ignore the marker so the cache still
    # gets rebuilt from scratch on its usual cadence.
    - if: $CI_PIPELINE_SOURCE != 'schedule' && $CI_COMMIT_BRANCH == 'main' && $CI_COMMIT_MESSAGE =~ $DOCS_SKIP_CLEAN_PATTERN
    - if: $CI_COMMIT_BRANCH == 'main'
      variables:
        DOCS_CLEAN: '-- clean'
    - if: $CI_COMMIT_BRANCH =~ $RELEASE_BRANCH_PATTERN
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
      changes:
        paths:
          - src/**/*
          - docs/**/*
          - uv.lock
          - '*.md'

# Any merge request, regardless of which files changed. The preview site is
# assembled from whichever of the docs and coverage jobs actually ran.
.rules_mr_preview:
  rules:
    - if: $CREATE_NEW_RELEASE || $CREATE_PRE_RELEASE || $PUBLISH_VERIFICATION || $CI_COMMIT_BRANCH == 'main'
      when: never
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'

.rules_mr_only:
  rules:
    - if: $CREATE_NEW_RELEASE || $CREATE_PRE_RELEASE || $PUBLISH_VERIFICATION || $CI_COMMIT_BRANCH == 'main'
      when: never
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event' && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == 'main'

.rules_main_only:
  rules:
    - if: $CREATE_NEW_RELEASE || $CREATE_PRE_RELEASE || $PUBLISH_VERIFICATION
      when: never
    - if: $CI_COMMIT_BRANCH == 'main'

.rules_release_only:
  rules:
    - if: $CREATE_NEW_RELEASE

.rules_prerelease_only:
  rules:
    - if: $CREATE_PRE_RELEASE

.rules_release_branch_only:
  rules:
    - if: $CI_COMMIT_BRANCH =~ $RELEASE_BRANCH_PATTERN

.rules_verification_only:
  rules:
    - if: $CREATE_NEW_RELEASE || $PUBLISH_VERIFICATION

###############################################################################
# Stage -- Trigger the DevSecOps components
###############################################################################
.trigger_compliance:
  stage: compliance
  trigger:
    include: ".gitlab/ci/compliance.yml"
    strategy: depend
  allow_failure: true

trigger_compliance:
  extends: .trigger_compliance
  rules:
    - if: $CREATE_NEW_RELEASE || $CREATE_PRE_RELEASE || $PUBLISH_VERIFICATION
      when: never
    - if: '$CI_COMMIT_BRANCH == "main"'
  variables:
    PACKAGE_NAME: "dataeval"
