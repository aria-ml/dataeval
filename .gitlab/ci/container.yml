### CONTAINER PUBLISH JOBS ###
#
# Builds, signs, scans and publishes the DataEval base execution environment to
# Harbor at aria/dataeval. This image is a library runtime, not an application:
# it declares no ENTRYPOINT and no CMD. See docker/Dockerfile.j2 for why that is
# deliberate and which requirements it keeps out of scope.
#
# Requirement coverage:
#   CS-1-H-1..3   OCI image via buildx, Dockerfile in-repo, --platform amd64
#   CS-2-H-1      non-root USER in the prod stage
#   CS-2-H-2/H-3  container_scanning (Trivy via the GitLab template)
#   CS-2-H-3      Trivy report copied into the image by the `scanned` stage
#   CS-2-H-4      Syft CycloneDX SBOM, attested to the registry by digest
#   CS-3-H-1      cosign signature over the image digest
#   CS-4-H-1      semver image tags, resolved by docker/resolve-version.sh
#   DSOR-3-H-1    promotion gating scan runs in this pipeline
#
# Setup this pipeline depends on:
#   COSIGN_PRIVATE_KEY_B64  Group-level CI/CD variable on jatic/aria (masked,
#                           protected), inherited by this project and shared
#                           between DataEval and DataEval-Flow images.
#   HARBOR_TOKEN            Group-level CI/CD variable on jatic/aria (masked,
#                           protected), providing access for the common
#                           robot$aria+aria-bot account.


include:
  - template: Security/Container-Scanning.gitlab-ci.yml

variables:
  HARBOR_URL: harbor.jatic.net
  # CS-2-H-2 names Trivy v0.62.0+ as an approved scanner. Pinned rather than
  # floating so a published image's report names a scanner version that was
  # chosen, not whatever happened to be current the day it built.
  TRIVY_VERSION: "0.74.0"
  CI_APPLICATION_REPOSITORY: ${HARBOR_URL}/aria/dataeval
  CI_CACHE_REPOSITORY: ${HARBOR_URL}/aria/cache
#
# The Harbor robot account name is deliberately NOT a variable here. It contains
# a `$` (robot$aria+aria-bot), and GitLab expands variable values when it
# materializes them -- `$aria` is undefined, so the value silently becomes
# `robot+aria-bot` and the login fails with a confusing 401. YAML quoting does
# not help: those quotes are consumed by the YAML parser long before GitLab
# performs the expansion. The name is written inline, in shell single quotes, at
# each point of use, which is the only place the quoting survives to something
# that will not expand it.

.variants: &variants
  - VARIANT: [cpu, cu126, cu130]

### SHARED RULE TEMPLATES ###

# Two images are ever built, and a third tag points at one of them:
#
#   :main-<variant>      the newest build of the default branch
#   :<version>-<variant> a tagged release, immutable
#   :latest-<variant>    a retag of the highest stable release
#
# `latest` is a pointer, not a build -- `imagetools create` repoints it at a
# digest that is already published, scanned and signed, so it costs no storage
# and inherits every guarantee the release carries. It follows releases rather
# than the branch because that is what users assume it means; a `latest` built
# from the default branch advertises a version *older* than the newest release
# whenever releases are cut from a release branch, which is exactly the shape
# of this repository.
#
# Nothing else reaches the registry. An earlier design also pushed a
# version-stamped tag from every main and release-branch commit
# (:1.1.1.dev110-g8b978998-cpu and so on). Those accumulate without bound --
# 145 of them, 357 GiB, filled the Harbor project's 500 GiB quota and began
# failing pushes outright. A floating :latest that is overwritten in place
# costs one tag per variant no matter how long main runs.
.rules_container_publish:
  rules:
    - if: $PUBLISH_VERIFICATION
      when: never
    - if: $CI_PIPELINE_SOURCE == 'schedule' && $DOCS_NIGHTLY
      when: never
    # Only version tags. The `latest-known-good` tag that `tag release
    # candidate` repoints on every green main pipeline must not build images.
    - if: $CI_COMMIT_TAG =~ /^v\d+/
    - if: $CI_COMMIT_BRANCH == 'main'

# Release branches build but never publish. Their Dockerfiles can diverge from
# main's -- release/v1.1 is a different tree -- so the build still has to be
# exercised before a tag is cut, but the artifact it produces is thrown away
# rather than parked in the registry under a name nobody pulls.
.rules_container_validate:
  rules:
    - if: $PUBLISH_VERIFICATION
      when: never
    - if: $CI_PIPELINE_SOURCE == 'schedule' && $DOCS_NIGHTLY
      when: never
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_BRANCH =~ $RELEASE_BRANCH_PATTERN

### SHARED JOB TEMPLATES ###

.container_setup:
  extends: .rules_container_publish
  stage: publish
  image: docker:25.0.5-git
  variables:
    COSIGN_PASSWORD: ''
  before_script:
    # docker:25.0.5-git is Alpine and ships ash, not bash.
    # docker/resolve-version.sh uses `[[ =~ ]]` and BASH_REMATCH.
    - apk add --no-cache bash
    # Robot name inline and single-quoted -- see the note by the variables block.
    - echo "${HARBOR_TOKEN}" | docker login "${HARBOR_URL}" --username 'robot$aria+aria-bot' --password-stdin
  after_script:
    - docker logout "${HARBOR_URL}" || true

.push_setup:
  extends: .container_setup
  before_script:
    - !reference [.container_setup, before_script]
    # jq is consumed downstream by release:sbom to unwrap the CycloneDX
    # predicate from the cosign attestation envelope.
    - apk add --no-cache cosign jq
    # Trivy is installed from its release tarball rather than apk: Alpine's
    # package lags, and CS-2-H-2 sets a version floor the image's own report
    # has to be able to name.
    - >-
      wget -qO- "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
      | tar -xz -C /usr/local/bin trivy
    - trivy --version
    # syft generates the CycloneDX SBOM. Installed here rather than mid-job so a
    # missing tool fails before anything is built.
    - apk add --no-cache curl
    - curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin
    - syft --version
    # The docker-container driver is required for type=registry build cache.
    - docker buildx create --use --name ci-builder || true

### JOBS ###

# Resolve the PEP 440 and OCI-safe versions ONCE for the whole pipeline. Both
# are derived from git tags (the hatch-vcs source of truth) and are identical
# across variants -- only the `-${VARIANT}` tag suffix differs -- so every
# downstream job consumes this dotenv rather than re-running the script 15x
# across the matrix.
resolve:version:
  rules:
    - !reference [.rules_container_publish, rules]
    - !reference [.rules_container_validate, rules]
  stage: publish
  image: alpine:latest
  needs: []
  variables:
    GIT_STRATEGY: fetch
    GIT_DEPTH: '0'  # full history so `git describe` resolves a real version
  before_script:
    - apk add --no-cache bash git
  script:
    - git fetch --tags --force
    - eval "$(./docker/resolve-version.sh)"
    # The tag the image is published under. A release pipeline publishes the
    # version verbatim and never overwrites it; every other pipeline that
    # publishes at all is main, which overwrites :latest in place.
    # DATAEVAL_VERSION is unaffected -- it is what gets baked into the wheel
    # and the OCI label, so a branch image still reports its true version.
    # The branch build is named after the branch it came from, so the tag and
    # its source stay 1:1 without anyone maintaining a second copy of the name.
    - |
      if [ -n "${CI_COMMIT_TAG:-}" ]; then
        DATAEVAL_PUBLISH_TAG="${DATAEVAL_IMAGE_TAG}"
      else
        DATAEVAL_PUBLISH_TAG="${CI_DEFAULT_BRANCH}"
      fi
    - echo "DATAEVAL_VERSION=${DATAEVAL_VERSION}" > version.env
    - echo "DATAEVAL_IMAGE_TAG=${DATAEVAL_IMAGE_TAG}" >> version.env
    - echo "DATAEVAL_PUBLISH_TAG=${DATAEVAL_PUBLISH_TAG}" >> version.env
    - cat version.env
  artifacts:
    reports:
      dotenv: version.env

push:docker:
  extends: .push_setup
  needs:
    - job: resolve:version
      artifacts: true
  parallel:
    matrix: *variants
  script:
    # DATAEVAL_VERSION / DATAEVAL_PUBLISH_TAG are inherited from resolve:version.
    - PUBLISH_TAG="${DATAEVAL_PUBLISH_TAG}-${VARIANT}"
    - echo "Building dataeval ${DATAEVAL_VERSION} → ${CI_APPLICATION_REPOSITORY}:${PUBLISH_TAG}"

    # Build the test stage first. It runs docker/smoke.py against the frozen,
    # variant-specific venv; a failure here fails the job and nothing is pushed.
    #
    # Two --cache-from refs, one per product. DataEval and DataEval-Flow build
    # the same base (ubuntu:24.04, the same Python and uv pins) and diverge
    # only once their own dependencies are installed. BuildKit keys cache
    # entries on the content of each step, so the shared prefix hits whichever
    # product warmed it first and the product-specific tail only ever hits its
    # own ref. --cache-to writes this product's ref alone, so neither can
    # clobber the other's.
    - >-
      docker buildx build --target test
      --platform linux/amd64
      --build-arg DATAEVAL_VERSION="${DATAEVAL_VERSION}"
      --cache-from type=registry,ref=${CI_CACHE_REPOSITORY}:dataeval-${VARIANT}
      --cache-from type=registry,ref=${CI_CACHE_REPOSITORY}:dataeval-flow-${VARIANT}
      --cache-to type=registry,ref=${CI_CACHE_REPOSITORY}:dataeval-${VARIANT},mode=max,image-manifest=true
      -f docker/Dockerfile.${VARIANT} .

    # Build `prod` to a local tarball rather than pushing it. The image has to
    # exist before it can be scanned, and it must not exist *in the registry*
    # before the scan has passed -- once the published tag is written there is
    # no taking it back. `type=docker,dest=` avoids importing multiple GiB into
    # the daemon just to hand it to trivy. The image is tagged even though it is
    # not pushed: the tag rides along inside the tarball, so the report records
    # `Metadata.RepoTags` naming the image it describes instead of describing an
    # anonymous tarball nobody can trace back to a release.
    - >-
      docker buildx build --target prod
      --platform linux/amd64
      --build-arg DATAEVAL_VERSION="${DATAEVAL_VERSION}"
      --cache-from type=registry,ref=${CI_CACHE_REPOSITORY}:dataeval-${VARIANT}
      --cache-from type=registry,ref=${CI_CACHE_REPOSITORY}:dataeval-flow-${VARIANT}
      -f docker/Dockerfile.${VARIANT}
      -t ${CI_APPLICATION_REPOSITORY}:${PUBLISH_TAG}
      --output type=docker,dest=prod-${VARIANT}.tar .

    # Vulnerability scan report, written into the build context so the
    # `scanned` stage can copy it into the published image [CS-2-H-3]. JSON is
    # the machine-readable record; the table is what a human opens.
    - mkdir -p docker/security
    - >-
      trivy image --input prod-${VARIANT}.tar --scanners vuln
      --format json --output docker/security/vulnerability-scan.json
    - >-
      trivy image --input prod-${VARIANT}.tar --scanners vuln
      --format table --output docker/security/vulnerability-scan.txt
    - chmod 0644 docker/security/vulnerability-scan.*

    # The publishing gate [CS-2-H-2]: exit 1 on any HIGH or CRITICAL finding,
    # before the image reaches the registry. container_scanning re-scans the
    # pushed image afterwards so findings land in GitLab's Vulnerability Report
    # with its dismissal workflow, but that runs too late to stop a push -- this
    # is what actually withholds a dirty image.
    - trivy image --input prod-${VARIANT}.tar --scanners vuln --severity HIGH,CRITICAL --exit-code 1 --quiet

    # SBOM, generated from the same tarball that was scanned and copied into the
    # image beside the report [CS-2-H-4]. Generating it here rather than from the
    # pushed image means one syft run instead of two, and the package list is
    # identical either way: the only thing `scanned` adds to `prod` is the report
    # layer, which installs nothing. It is also attested to the registry below,
    # which is what CS-2-H-4 actually requires -- shipping a copy inside the
    # image as well means an auditor with only the image still has it.
    - syft scan docker-archive:prod-${VARIANT}.tar -o cyclonedx-json=docker/security/sbom.cdx.json
    - cp docker/security/sbom.cdx.json sbom-${VARIANT}.json
    - chmod 0644 docker/security/sbom.cdx.json
    - rm -f prod-${VARIANT}.tar

    # Publish `scanned` -- `prod` plus the report layer. Rebuilt from the local
    # cache the previous build just populated, so this adds one layer, not one
    # build. On main this overwrites :latest-${VARIANT} in place; on a tag it
    # writes :${VERSION}-${VARIANT}, which is never rewritten.
    - >-
      docker buildx build --target scanned
      --platform linux/amd64
      --build-arg DATAEVAL_VERSION="${DATAEVAL_VERSION}"
      --cache-from type=registry,ref=${CI_CACHE_REPOSITORY}:dataeval-${VARIANT}
      --cache-from type=registry,ref=${CI_CACHE_REPOSITORY}:dataeval-flow-${VARIANT}
      -f docker/Dockerfile.${VARIANT}
      -t ${CI_APPLICATION_REPOSITORY}:${PUBLISH_TAG}
      --push .

    # Sign the digest [CS-3-H-1]. `imagetools inspect` reads the digest back
    # from the registry because buildx --push never loads the image locally.
    - printf '%s' "$COSIGN_PRIVATE_KEY_B64" | base64 -d > cosign.key
    - chmod 600 cosign.key
    - DIGEST=$(docker buildx imagetools inspect "${CI_APPLICATION_REPOSITORY}:${PUBLISH_TAG}" --raw | sha256sum | awk '{print "sha256:"$1}')
    - cosign sign --key cosign.key --yes "${CI_APPLICATION_REPOSITORY}@${DIGEST}"

    # Attach the SBOM built above to the registry as a CycloneDX cosign
    # attestation [CS-2-H-4]. The same file is kept as a CI artifact, and
    # release:sbom republishes it on tags with permanent retention.
    - cosign attest --key cosign.key --type cyclonedx --predicate sbom-${VARIANT}.json --yes "${CI_APPLICATION_REPOSITORY}@${DIGEST}"
    - rm -f cosign.key
  artifacts:
    paths:
      - sbom-*.json
    expire_in: 30 days

# Release-branch build check. Builds through the `test` target -- which runs
# docker/smoke.py inside the image -- and stops there. Nothing is tagged and
# nothing is pushed, so a release branch costs zero registry storage while
# still proving its own Dockerfiles build and import cleanly before a tag is
# cut from it. It reads both cache refs but writes neither: a build that is
# never published should not be able to poison the cache a published one uses.
validate:docker:
  extends: .push_setup
  rules:
    - !reference [.rules_container_validate, rules]
  needs:
    - job: resolve:version
      artifacts: true
  parallel:
    matrix: *variants
  script:
    - echo "Validating dataeval ${DATAEVAL_VERSION} (${VARIANT}) -- no publish"
    - >-
      docker buildx build --target test
      --platform linux/amd64
      --build-arg DATAEVAL_VERSION="${DATAEVAL_VERSION}"
      --cache-from type=registry,ref=${CI_CACHE_REPOSITORY}:dataeval-${VARIANT}
      --cache-from type=registry,ref=${CI_CACHE_REPOSITORY}:dataeval-flow-${VARIANT}
      -f docker/Dockerfile.${VARIANT} .


# Verify the signature and SBOM attestation on the pushed image, then confirm
# the artifact actually runs.
verify:docker:
  extends: .container_setup
  needs:
    - job: push:docker
    - job: resolve:version
      artifacts: true
  parallel:
    matrix: *variants
  before_script:
    - !reference [.container_setup, before_script]
    - apk add --no-cache cosign
    - export PUBLISH_TAG="${DATAEVAL_PUBLISH_TAG}-${VARIANT}"
  script:
    - docker pull "${CI_APPLICATION_REPOSITORY}:${PUBLISH_TAG}"
    - cosign verify --key docker/cosign.pub "${CI_APPLICATION_REPOSITORY}:${PUBLISH_TAG}"
    - cosign verify-attestation --key docker/cosign.pub --type cyclonedx "${CI_APPLICATION_REPOSITORY}:${PUBLISH_TAG}" > /dev/null

    # Smoke test the published artifact. There is no --help to call: the image
    # declares no entrypoint, so the command comes from the caller, which is
    # exactly how users are documented to run it.
    - |
      RUNTIME_VERSION=$(docker run --rm "${CI_APPLICATION_REPOSITORY}:${PUBLISH_TAG}" \
        python -c "import dataeval; print(dataeval.__version__)")
      echo "Image reports dataeval ${RUNTIME_VERSION}, expected ${DATAEVAL_VERSION}"
      if [ "${RUNTIME_VERSION}" != "${DATAEVAL_VERSION}" ]; then
        echo "Version baked into the image does not match the tag it was published under."
        exit 1
      fi

    # The published image must carry its own scan report [CS-2-H-3] and SBOM.
    # Checked against the running artifact rather than the Dockerfile, because
    # a COPY that silently produced an empty directory still looks correct in
    # source, and an empty JSON file still parses.
    - |
      docker run --rm "${CI_APPLICATION_REPOSITORY}:${PUBLISH_TAG}" python -c "
      import json
      base = '/usr/share/dataeval/security/'
      scan = json.load(open(base + 'vulnerability-scan.json'))
      tags = (scan.get('Metadata') or {}).get('RepoTags') or []
      print('scan report: trivy', scan['Trivy']['Version'], '| repoTags', tags)
      assert scan.get('SchemaVersion'), 'scan report has no SchemaVersion'
      assert tags, 'scan report does not name the image it describes'
      sbom = json.load(open(base + 'sbom.cdx.json'))
      comps = sbom.get('components') or []
      print('sbom:', sbom.get('bomFormat'), sbom.get('specVersion'), '|', len(comps), 'components')
      assert sbom.get('bomFormat') == 'CycloneDX', 'in-image SBOM is not CycloneDX'
      assert len(comps) > 50, f'in-image SBOM lists only {len(comps)} components'
      "

    # Confirm the image runs as a non-root user [CS-2-H-1]. The Dockerfile's
    # USER instruction is verified statically by the scanner; this catches a
    # base image that resolves the name to uid 0.
    - |
      UID_IN_IMAGE=$(docker run --rm "${CI_APPLICATION_REPOSITORY}:${PUBLISH_TAG}" id -u)
      echo "Image default uid: ${UID_IN_IMAGE}"
      if [ "${UID_IN_IMAGE}" = "0" ]; then
        echo "Image runs as root; CS-2-H-1 requires a non-root default user."
        exit 1
      fi

# Container vulnerability scan [DSOR-3-H-1].
#
# Uses the GitLab-managed Container-Scanning template rather than a hand-rolled
# Trivy job, so findings land in the GitLab Vulnerability Report and dismissals
# carry a CVE, justification and re-evaluation date.
#
# CS_SEVERITY_THRESHOLD is HIGH, matching CS-2-H-2 ("no critical or high") and
# DataEval-Flow's setting. Note that DSOR-3-H-2 is written more strictly than
# CS-2-H-2 -- it also bars MEDIUM findings. Gating a PyTorch-bearing image at
# MEDIUM would block essentially every release on upstream CVE churn, so the
# threshold is a deliberate choice to match the containerization standard and
# the sibling product. Revisit if the program resolves the two requirements.
container_scanning:
  stage: publish
  needs:
    - job: push:docker
    - job: resolve:version
      artifacts: true
  # The template hard-sets `dependencies: []`, which blocks ALL artifact
  # downloads -- including resolve:version's dotenv -- regardless of
  # `needs: artifacts: true`. Without this override DATAEVAL_IMAGE_TAG resolves
  # empty and the scan aborts with image-not-found.
  dependencies: ['resolve:version']
  parallel:
    matrix: *variants
  variables:
    # Pin the analyzer to the floating v8 major so Trivy and its advisory DB
    # track the latest release rather than whatever the instance default lags at.
    CS_ANALYZER_IMAGE: "$CI_TEMPLATE_REGISTRY_HOST/security-products/container-scanning:8"
    CS_SEVERITY_THRESHOLD: HIGH
    CS_REGISTRY_PASSWORD: $HARBOR_TOKEN
    # Check out the repo (the template default is no clone) and point
    # auto-remediation at the per-variant Dockerfile.
    GIT_STRATEGY: fetch
    CS_DOCKERFILE_PATH: "docker/Dockerfile.${VARIANT}"
  before_script:
    # dotenv vars are injected into the job environment at runtime but are NOT
    # expanded inside the `variables:` keyword -- declaring CS_IMAGE there
    # yields an empty tag. Assemble it here, where the dotenv var is present.
    - export CS_IMAGE="${CI_APPLICATION_REPOSITORY}:${DATAEVAL_PUBLISH_TAG}-${VARIANT}"
    # Exported here rather than declared under `variables:` for the same reason
    # the docker login spells it inline: GitLab would expand the `$aria` in
    # `robot$aria+aria-bot` to nothing and the analyzer would authenticate as
    # `robot+aria-bot`. Single quotes here are the shell's, so the `$` survives.
    - export CS_REGISTRY_USER='robot$aria+aria-bot'
    - echo "Scanning ${CS_IMAGE} as ${CS_REGISTRY_USER}"
  # Promote the scan from the template's advisory default to a gate.
  allow_failure: false
  rules:
    - !reference [.rules_container_publish, rules]

# Point :latest-${VARIANT} at this release, if it is the newest one.
#
# A server-side retag via `imagetools create` -- no pull, no rebuild, no new
# storage. The digest is already cosign-signed and carries its own scan report
# and SBOM attestation, so every guarantee follows the pointer.
#
# Gated on the scan: `needs` includes container_scanning, so a release that
# fails its scan can never take the pointer users pull by default.
promote:latest:
  extends: .push_setup
  stage: attest
  needs: [push:docker, verify:docker, container_scanning, 'resolve:version']
  parallel:
    matrix: *variants
  variables:
    # Full tag history: promote-latest.sh ranks this release against every
    # other one to decide whether it may hold the pointer.
    GIT_DEPTH: '0'
  rules:
    - if: $PUBLISH_VERIFICATION
      when: never
    - if: $CI_COMMIT_TAG =~ /^v\d+/
  script:
    - git fetch --tags --force
    - PROMOTE=$(git tag -l 'v*' | ./docker/promote-latest.sh)
    - |
      if [ -z "$PROMOTE" ]; then
        echo "${CI_COMMIT_TAG} is not the highest stable release; :latest-${VARIANT} left where it is."
        exit 0
      fi
    - echo "Promoting ${DATAEVAL_PUBLISH_TAG}-${VARIANT} → latest-${VARIANT}"
    - >-
      docker buildx imagetools create
      -t ${CI_APPLICATION_REPOSITORY}:latest-${VARIANT}
      ${CI_APPLICATION_REPOSITORY}:${DATAEVAL_PUBLISH_TAG}-${VARIANT}

# Per-version SBOM release artifact [CS-2-H-4].
# Downloads the CycloneDX attestation written by push:docker (digest-addressed,
# so it is found by digest rather than by tag) and republishes it as a
# versioned artifact with permanent retention. Tag-only: main pipelines already
# retain the 30-day artifact from push:docker.
release:sbom:
  extends: .push_setup
  stage: attest
  needs: [push:docker, verify:docker, container_scanning, 'resolve:version']
  parallel:
    matrix: *variants
  rules:
    - if: $PUBLISH_VERIFICATION
      when: never
    - if: $CI_COMMIT_TAG =~ /^v\d+/
  script:
    - PUBLISH_TAG="${DATAEVAL_PUBLISH_TAG}-${VARIANT}"
    - DIGEST=$(docker buildx imagetools inspect "${CI_APPLICATION_REPOSITORY}:${PUBLISH_TAG}" --raw | sha256sum | awk '{print "sha256:"$1}')
    - >-
      cosign download attestation --predicate-type https://cyclonedx.org/bom "${CI_APPLICATION_REPOSITORY}@${DIGEST}"
      | jq -r '.payload' | base64 -d | jq '.predicate' > sbom-${DATAEVAL_VERSION}-${VARIANT}.json
  artifacts:
    paths:
      - sbom-*.json
    expire_in: never
