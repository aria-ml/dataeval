    - maite::test_model_entrypoint_targets_importable
- id: 12-2
  req: FR-12
  name: Metadata JSON Schema
  type: Integration
  business: The `metadata.json` schema round-trips dataset, model, and extractor records with provenance, and rejects
    malformed documents.
  conditions:
  - DataEval installed with `pydantic`
  steps:
  - do: Serialize and re-parse `DatasetInfo` and `ModelInfo` separately and in one document.
    expect: All fields survive each round trip.
    tests:
    - mjson::test_dataset_info_round_trip
    - mjson::test_model_info_round_trip
    - mjson::test_combined_dataset_and_model
    - mjson::test_individual_info_types_serialize_independently
  - do: Serialize a document with dataset selections and an extractor with a model and transforms.
    expect: All blocks round-trip within one document.
    tests:
    - mjson::test_dataset_selections_and_extractor_round_trip
  - do: Emit JSON and stamp it with `Output.meta()`.
    expect: The JSON is indented, valid, carries `schema_version`, and its `provenance` block is the `ExecutionMetadata`
      record.
    tests:
    - mjson::test_emitted_json_is_human_readable
    - mjson::test_execution_metadata_serializes_as_provenance
  - do: Parse a document with no `dataset`, `model`, or `extractor`, and one with an unknown field.
    expect: Each raises a validation error that names the problem.
    tests:
    - mjson::test_schema_rejects_empty_payload
    - mjson::test_schema_rejects_unknown_fields
- id: 21-1
  req: NFR-1
  name: Platform Compatibility
  type: Core Functionality
  business: DataEval installs and runs on every supported Python version, installer, and hardware configuration.
  conditions:
  - CI pipeline results for the supported Python versions (3.10-3.14)
  steps:
  - do: Run the version checks on the current Python version.
    expect: The version is supported, the package imports, and `typing_extensions` is available.
    tests:
    - pyver::test_running_on_supported_version
    - pyver::test_import_succeeds_on_current_version
    - pyver::test_typing_extensions_available
  - do: Review the `test` and `verify` CI jobs across the Python 3.10-3.14 matrix.
    expect: The unit and verification suites pass on every supported version.
    tests:
    - 'CI: test'
    - 'CI: verify'
  - do: Review the `conda`, `minimum install`, and `verify lock` CI jobs.
    expect: conda, lowest-direct, and lock-file installs resolve without conflicts; poetry installs from source.
    tests:
    - 'CI: conda'
    - 'CI: minimum install'
    - 'CI: verify lock'
  - do: Run a core evaluator with CUDA hidden.
    expect: The evaluator runs on CPU without error.
    tests:
    - cfg::test_core_evaluator_falls_back_to_cpu_without_cuda
  - do: Run the verification suite with warnings as errors.
    expect: No version-specific deprecation warnings are raised.
    tests:
    - 'NEW: verification suite runs with -W error::DeprecationWarning'
- id: 22-1
  req: NFR-2
  name: Package Distribution
  type: Core Functionality
  business: The released package has the right contents and is published to both channels.
  conditions:
  - A built wheel and sdist, and the release published
  steps:
  - do: Inspect the wheel and sdist contents.
    expect: Only `src/dataeval/` files are included, with the `py.typed` marker and all expected subpackages, and
      no tests.
    tests:
