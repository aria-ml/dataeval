    - wheel::test_expected_subpackages_present
    - wheel::test_no_test_files_in_package
  - do: Read the installed version and metadata.
    expect: '`__version__` is not `unknown`, and Name, Requires-Python, License, and Project-URL are set.'
    tests:
    - vmeta::test_version_not_unknown
    - vmeta::test_package_name
    - vmeta::test_requires_python
    - vmeta::test_license_set
    - vmeta::test_project_urls_set
  - do: Check the published release on PyPI and conda-forge.
    expect: The release version is available on both.
    tests:
    - 'NEW: published-release check (PyPI and conda-forge) in the release pipeline'
  - do: Review the `verify lock` CI job.
    expect: Lock files and `environment.yml` match `pyproject.toml`.
    tests:
    - 'CI: verify lock'
- id: 23-1
  req: NFR-3
  name: Type Safety
  type: Core Functionality
  business: DataEval ships complete type information that downstream projects can check.
  conditions:
  - DataEval installed
  steps:
  - do: Check for the `py.typed` marker.
    expect: The marker exists.
    tests:
    - types::test_py_typed_marker_exists
  - do: Import `dataeval.protocols` and `dataeval.types`.
    expect: The protocols and output base classes are exported.
    tests:
    - types::test_protocols_module_exports_types
    - types::test_types_module_exports_output_bases
  - do: Read `__all__` for the public modules.
    expect: Each public module defines `__all__`.
    tests:
    - types::test_public_modules_have_all
  - do: Review the `pyright` CI jobs.
    expect: '`pyright --verifytypes` reports more than 90% completeness and `pyright` passes on `src/` and `tests/`.'
    tests:
    - 'CI: pyright'
    - 'NEW: verifytypes completeness gate in verification'
- id: 24-1
  req: NFR-4
  name: Config and Reproducibility
  type: Core Functionality
  business: Global settings take effect, scoped overrides restore, and a seed gives identical results with recorded
    execution metadata.
  conditions:
  - DataEval installed
  steps:
  - do: Set and get the seed, device, and maximum processes.
    expect: Each `get_*` returns what was set.
    tests:
    - cfg::test_set_seed_and_get_seed
    - cfg::test_set_device_and_get_device
    - cfg::test_set_max_processes
  - do: Set and get the batch size.
    expect: '`get_batch_size` returns what was set.'
    tests:
    - cfg::test_set_batch_size_and_get_batch_size
  - do: Override device, batch size, and maximum processes in `use_*` scopes.
    expect: Each previous value is restored on exit.
    tests:
    - cfg::test_use_device_context_manager
    - cfg::test_use_max_processes_context_manager
    - cfg::test_use_batch_size_context_manager
    - cfg::test_use_scopes_nest_and_restore_after_error
  - do: Run the same evaluator twice with the same seed.
    expect: The results are identical.
    tests:
    - cfg::test_seed_produces_reproducible_results
  - do: Call `.meta()` on an evaluator output.
    expect: Name, time, duration, arguments, and version are present.
    tests:
    - bias::test_all_bias_outputs_support_meta
    - quality::test_quality_outputs_support_meta
  - do: Run an evaluator with a `logging` handler attached.
    expect: DataEval emits records through the standard framework.
    tests:
    - cfg::test_dataeval_logging_uses_standard_logging_framework
- id: 25-1
  req: NFR-5
  name: Performance and Scale
  type: Performance
  business: Memory use follows the size of the stored embeddings, and reference workloads are checked against their
    recorded time budgets for regressions.
  conditions:
  - A 10,000-image synthetic dataset
  - Reference hardware for the pipeline runner
  - Budgets recorded from the v1.1.4 baseline
  steps:
  - do: Compute `Embeddings` with a disk cache at two dataset sizes.
    expect: Peak memory grows roughly in proportion to the stored embeddings (baseline about 9 KB per sample) and
      stays well below the size of the raw dataset.
    tests:
    - perf::test_cached_embeddings_memory_bounded
  - do: Set `max_processes` to 1, 2, 4, and N and time `Duplicates` and `Outliers` at each setting.
    expect: The worker count stays at or below the setting, and the timing at each setting is recorded.
    tests:
    - perf::test_max_processes_bounds_workers
  - do: Time `Duplicates`, `Outliers`, `Balance`, and `DriftKNeighbors` on the dataset.
    expect: Each completes within its budget. The CI-runner baselines are 7.96 s, 13.87 s, 0.72 s, and 2.08 s
      (2.8 s, 3.8 s, 0.5 s, and 2.6 s on the development machine), so the budgets are 16 s, 28 s, 1.5 s, and
      4.5 s.
    tests:
    - perf::test_reference_workloads_within_time_budgets
