    - inputs::test_invalid_argument_raises_error_naming_it[ood-kneighbors-k]
    - inputs::test_invalid_argument_raises_error_naming_it[drift-wasserstein-ratio]
    - inputs::test_invalid_argument_raises_error_naming_it[prioritize-method]
    - inputs::test_invalid_argument_raises_error_naming_it[sufficiency-runs]
    - inputs::test_invalid_argument_raises_error_naming_it[sufficiency-substeps]
    - inputs::test_invalid_argument_raises_error_naming_it[embeddings-batch-size]
    - inputs::test_invalid_argument_raises_error_naming_it[bovw-vocab-size]
    - inputs::test_invalid_argument_raises_error_naming_it[resize-size]
    - inputs::test_invalid_argument_raises_error_naming_it[resize-mode]
    - inputs::test_invalid_argument_raises_error_naming_it[select-channels]
    - inputs::test_invalid_argument_raises_error_naming_it[crop-region]
