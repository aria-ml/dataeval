[project]
name = "dataeval"
dynamic = ["version"]
description = "DataEval provides a simple interface to characterize image data and its impact on model performance across classification and object-detection tasks"
authors = [
  { name = "Andrew Weng", email = "andrew.weng@ariacoustics.com" },
  { name = "Bill Peria", email = "bill.peria@ariacoustics.com" },
  { name = "Christina Doty", email = "christina.doty@ariacoustics.com" },
  { name = "Jon Botts", email = "jonathan.botts@ariacoustics.com" },
  { name = "Jonathan Christian", email = "jonathan.christian@ariacoustics.com" },
  { name = "Justin McMillan", email = "justin.mcmillan@ariacoustics.com" },
  { name = "Ryan Wood", email = "ryan.wood@ariacoustics.com" },
  { name = "Scott Swan", email = "scott.swan@ariacoustics.com" },
]
requires-python = ">=3.10"
readme = "README.md"
license = "MIT"
maintainers = [
  { name = "ARiA", email = "dataeval@ariacoustics.com" },
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Operating System :: OS Independent",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "maite>=0.9.4",
  "numba>=0.61.0",
  "lightgbm>=4",
  "numpy>=1.24.2",
  "polars>=1.0.0",
  "pydantic>=2.8",
  "scikit-learn>=1.5.0",
  "scipy>=1.10.0",
  "torch>=2.2.0",
  "typing-extensions>=4.12",
  "xxhash>=3.4",
  "psutil>=7.0.0",
]

[project.optional-dependencies]
cpu = ["torch>=2.2.0", "torchvision>=0.17.0"]
cu126 = ["torch>=2.2.0", "torchvision>=0.17.0"]
cu130 = ["torch>=2.2.0", "torchvision>=0.17.0"]
litert = ["ai-edge-litert>=2.0; python_version <= '3.14'"]
opencv = ["opencv-python-headless>=4.8.0"]
onnx = [
  "onnx>=1.14.0",
  "onnxruntime>=1.17",
]
onnx-cu126 = [
  "onnx>=1.14.0",
  "onnxruntime-gpu>=1.17,<1.24; python_version == '3.10' and extra != 'onnx-cu130'",
  "onnxruntime-gpu>=1.17,<1.27; python_version >= '3.11' and extra != 'onnx-cu130'",  # 1.27+ requires CUDA 13.0
  "onnxruntime-gpu>=1.24,<1.27; python_version >= '3.14' and extra != 'onnx-cu130'",  # 1.24+ for cp314 wheels
]
onnx-cu130 = [
  "onnx>=1.14.0",
  "onnxruntime>=1.17; python_version == '3.10' and extra != 'onnx-cu126'",  # CUDA 13.0 is not supported on Python 3.10
  "onnxruntime-gpu>=1.27; python_version >= '3.11' and extra != 'onnx-cu126'",
]
ontology = ["rdflib>=7.0"]

[project.urls]
Homepage = "https://dataeval.ai/"
Repository = "https://github.com/aria-ml/dataeval/"
Documentation = "https://dataeval.readthedocs.io/"

# MAITE interoperability entry-points.
[project.entry-points."maite.tasks"]
dataeval_balance = "dataeval.bias:Balance"
dataeval_diversity = "dataeval.bias:Diversity"
dataeval_parity = "dataeval.bias:Parity"
dataeval_outliers = "dataeval.quality:Outliers"
dataeval_duplicates = "dataeval.quality:Duplicates"
dataeval_sufficiency = "dataeval.performance:Sufficiency"

[project.entry-points."maite.protocols.image_classification.Model"]
dataeval_OnnxImageClassifier = "dataeval.models:OnnxImageClassifier"
dataeval_LiteRtImageClassifier = "dataeval.models:LiteRtImageClassifier"

[project.entry-points."maite.protocols.object_detection.Model"]
dataeval_OnnxObjectDetector = "dataeval.models:OnnxObjectDetector"
dataeval_LiteRtObjectDetector = "dataeval.models:LiteRtObjectDetector"

[dependency-groups]
base = [
  "uv>=0.8.0",
]
lock = [
  { include-group = "base" },
  "pyproject2conda>=0.22",
]
lint = [
  "ruff>=0.15",
  "codespell[toml]>=2.3",
  "typos>=1.0",
]
docsync = [
  "jupytext>=1.19.1",
]
test = [
  "coverage[toml]>=7.6",
  "pytest>=7.3.1",  # floor capped by the JATIC program standard; uv.lock resolves current
  "pytest-cov>=6.1",
  "pytest-xdist>=3.6.1",
]
test-onnx = [
  { include-group = "test" },
  "onnxscript>=0.6.0",
]
verify = [
  "pytest>=7.3.1",  # floor capped by the JATIC program standard; uv.lock resolves current
  "pyyaml>=6.0",
]
type = [
  "pyright[nodejs]>=1.1.400",
  "requests>=2.31",
  "pyyaml>=6.0",
]
docs = [
  "numpy>=1.24.2",  # floor capped by the JATIC program standard; uv.lock resolves current
  "certifi>=2024.07.04",
  "dataeval-plots[plotly]>=0.0.6",
  "ipykernel>=6.26.0",
  "ipywidgets>=8.1.1",
  "jinja2>=3.1.6",
  "jupyter-client>=8.6.0",
  "jupyter-cache>=1.0",
  "maite-datasets>=0.0.18",
  "myst-nb>=1.0",
  "opencv-python-headless>=4.8.0",
  "pandas>=2.0.0",
  "plotly>=6.2.0",
  "rapidfuzz>=3.0",
  "rdflib>=7.0",
  "sphinx-autoapi>=3.6.0",
  "sphinx-design>=0.6.1",
  "sphinx-immaterial>=0.12.5",
  "sphinx-new-tab-link>=0.8.0",
  "sphinx-tabs>=3.4.7",
  "Sphinx>=7.2.6,<9.0.0", # sphinx-immaterial <= 0.13.9 is not compatible with sphinx >=9.0
  "torchmetrics>=1.0.0",
  "markupsafe>=3,<3.0.2",
  "jupytext>=1.19.1",
  "ultralytics>=8.0.0",
]
dev = [
  { include-group = "base" },
  { include-group = "lint" },
  { include-group = "test-onnx" },
  { include-group = "type" },
  { include-group = "docs" },
  "nox>=2025.5.1",
  "nox-uv>=0.6.2",
  "pip>=25.1",
  "jupyter>=1.0",
]

[tool.uv]
conflicts = [
  [
    { extra = "cpu" },
    { extra = "cu126" },
    { extra = "cu130" },
  ],
  [
    { extra = "onnx" },
    { extra = "onnx-cu126" },
    { extra = "onnx-cu130" },
  ],
]
constraint-dependencies = [
    "cryptography>=46.0.5",    # CVE-2026-26007: Missing Subgroup Validation for SECT Curves
    "filelock>=3.20.3",        # GHSA-w853-jp5j-5j7f, GHSA-qmgc-5h2g-mvrw
    "pillow>=12.1.1",          # CVE-2026-25990: OOB write via PSD image
    "protobuf>=6.33.5",        # GHSA-7gcm-g887-7qv7
    "setuptools>=82.0.0",      # CVE-2026-23949: (jaraco_context) path traversal in tarball()
                               # CVE-2026-24049: (wheel) privilege escalation via unpack
    # FIPS: opencv builds newer than 4.12.0.88 are not approved for FIPS-enabled
    # hosts. All three distributions below ship the same `cv2` module and are
    # interchangeable to a resolver, so capping only one leaves the others free to
    # supply a newer cv2 (ultralytics pulls opencv-python). Cap all three.
    # Do not raise this ceiling without a compliance review.
    "opencv-python-headless<=4.12.0.88",
    "opencv-python<=4.12.0.88",
    "opencv-contrib-python<=4.12.0.88",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu126", extra = "cu126" },
  { index = "pytorch-cu130", extra = "cu130" },
]
torchvision = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu126", extra = "cu126" },
  { index = "pytorch-cu130", extra = "cu130" },
]

[tool.uv.extra-build-dependencies]
numba = ["tbb>=2021.6"]

[tool.hatch.build.targets.sdist]
include = ["src/dataeval"]

[tool.hatch.build.targets.wheel]
include = ["src/dataeval"]

[tool.hatch.build.targets.wheel.sources]
"src/dataeval" = "dataeval"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/dataeval/_version.py"

[tool.pyproject2conda]
# maite is only published on conda-forge; the defaults channel cannot resolve it.
channels = ["conda-forge"]

[tool.pyproject2conda.dependencies]
numpy = { skip = true, packages = "numpy>=1.24.2" }
scikit-learn = { skip = true, packages = "scikit-learn>=1.5.0" }
scipy = { skip = true, packages = "scipy>=1.10.0" }
torch = { pip = true }  # PyTorch is no longer maintained on conda-forge
xxhash = { skip = true, packages = "python-xxhash>=3.4" }

[tool.pyright]
include = ["src", "tests", "verification", "docs/source/notebooks"]
exclude = [
  "**/__pycache__",
  "**/node_modules",
  "**/.*",
  ".venv",
  "build",
  "output",
]
reportMissingImports = false

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
  "ignore:The default value of normalize_pixel_values changed:FutureWarning",
  "ignore:The default value of hash_radius will change:FutureWarning",
  "ignore:Clustering metrics expect discrete values but received continuous values:UserWarning",
]
addopts = [
  "--pythonwarnings=ignore::DeprecationWarning",
  "--verbose",
  "--durations=20",
  "--durations-min=1.0",
]
markers = [
  "required: marks tests for required features",
  "optional: marks tests for optional features",
  "cuda: marks tests that require cuda",
]

[tool.coverage.run]
source = ["src/dataeval"]
branch = true
concurrency = ["multiprocessing"]
parallel = true
omit = ["src/dataeval/_version.py"]

[tool.coverage.report]
exclude_also = [
  "raise NotImplementedError",
  ": \\.\\.\\.",
  "if TYPE_CHECKING:",
  # Debug reprs carry no logic worth asserting on, and pinning their exact text in a
  # test makes the string harder to improve than it is worth. coverage.py documents
  # `def __repr__` as a canonical exclusion.
  "def __repr__",
  "def __str__",
]
include = ["*/src/dataeval/*"]
omit = [
  "src/dataeval/core/_fast_hdbscan/*",
]
fail_under = 90

[tool.ruff]
exclude = [
  ".devcontainer",
  ".github",
  ".vscode",
  ".jupyter_cache",
  "*env*",
  "output",
  "_build",
  "build",
  ".nox",
  ".tox",
  "prototype",
  "src/dataeval/_version.py",
  "*.ipynb",
]
line-length = 120
indent-width = 4
target-version = "py310"
extend-include = ["*.ipynb"]

[tool.ruff.lint]
select = ["F", "E", "W", "C90", "I", "N", "D", "UP", "YTT", "ANN", "S", "BLE", "B", "A",
          "COM", "C4", "T10", "ISC", "ICN", "PYI", "PT", "Q", "RSE", "RET", "SLF", "SIM",
          "TID252", "ARG", "FIX", "PD", "FLY", "NPY", "RUF027", "RUF100", "PERF"]
# ANN101/ANN102 were removed in Ruff 0.8, so ignoring them is inert and Ruff warns as much.
# They stay because the JATIC program-standards Ruff config requires them verbatim in
# lint.ignore, and verify_ruff_config.py matches against the parsed TOML -- a comment
# cannot satisfy it, and the only other accepted spelling is bare "ANN", which would
# disable every annotation rule.
ignore = ["ANN101", "ANN102", "ANN401", "C408", "C416", "COM812", "NPY002", "SLF001"]
fixable = ["ALL"]
unfixable = []
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"
per-file-ignores = { "!src/*" = ["ANN", "ARG", "BLE", "S", "SLF", "RET", "C90", "D", "FIX", "N", "PERF"], "docs/*" = ["B904"], "docs/source/notebooks/*" = ["E402", "E501", "E703", "RUF100", "SIM105", "UP009"] }

[tool.ruff.lint.flake8-builtins]
builtins-strict-checking = false

[tool.ruff.lint.isort]
known-first-party = ["dataeval"]

[tool.ruff.lint.mccabe]
max-complexity = 5

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.format]
preview = true
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = "dynamic"

[tool.typos.default]
extend-ignore-re = [
  "`[0-9a-fA-F]{7,40}`"
]

[tool.typos.default.extend-words]
ND = "ND"
strat = "strat"
iy = "iy"
fpr = "fpr"
Pont = "Pont"
setp = "setp"
writeable = "writeable"

[tool.typos.files]
extend-exclude = [
  "requirements.*.txt",
  "uv.lock",
]

[tool.codespell]
skip = 'pyproject.toml,./*env*,./specs,./output,./docs/build,./docs/source/.jupyter_cache,./docs/source/*/data,CHANGELOG.md,uv.lock,requirements.*.txt,*.html,*.lock,*.ipynb,./graphify-out'
ignore-words-list = ["Hart","FPR", "MOT", "mot", "reencode"]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"
